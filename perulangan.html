<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pola Bintang</title>
</head>
<body>

    <h2>1. Segitiga Naik</h2>
    <pre id="segitigaNaik"></pre>

    <h2>2. Segitiga Turun</h2>
    <pre id="segitigaTurun"></pre>

    <h2>3. Piramida</h2>
    <pre id="piramida"></pre>

    <h2>4. Piramida Terbalik</h2>
    <pre id="piramidaTerbalik"></pre>

    <h2>5. Diamond</h2>
    <pre id="diamond"></pre>


    <script>
        // 1. Segitiga Naik
        let hasil = "";

        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }
            hasil += "\n";
        }

        document.getElementById("segitigaNaik").textContent = hasil;


        // 2. Segitiga Turun
        hasil = "";

        for (let i = 5; i >= 1; i--) {
            for (let j = 1; j <= i; j++) {
                hasil += "*";
            }
            hasil += "\n";
        }

        document.getElementById("segitigaTurun").textContent = hasil;


        // 3. Piramida
        hasil = "";

        for (let i = 1; i <= 5; i++) {

            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        document.getElementById("piramida").textContent = hasil;


        // 4. Piramida Terbalik
        hasil = "";

        for (let i = 5; i >= 1; i--) {

            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        document.getElementById("piramidaTerbalik").textContent = hasil;


        // 5. Diamond
        hasil = "";

        // Bagian atas
        for (let i = 1; i <= 5; i++) {

            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        // Bagian bawah
        for (let i = 4; i >= 1; i--) {

            for (let j = 5; j > i; j--) {
                hasil += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {
                hasil += "*";
            }

            hasil += "\n";
        }

        document.getElementById("diamond").textContent = hasil;
    </script>

</body>
</html>
